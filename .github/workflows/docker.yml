name: CI - Build, Push, Update GitOps

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: household-budget-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GITOPS_REPOSITORY: uhjinkim9/helm-chart
  GITOPS_BRANCH: aws-migration
  CHART_PATH: charts/household-budget

jobs:
  build-and-push:
    name: Build & Push API/Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/household-budget-api
          tags: |
            type=raw,value=build-${{ github.run_number }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Extract Web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/household-budget-web
          tags: |
            type=raw,value=build-${{ github.run_number }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  update-gitops:
    name: Update Helm image tag
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 1

      - name: Update API and Web tags
        env:
          IMAGE_TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          VALUES_FILE="${CHART_PATH}/values.yaml"

          test -f "${VALUES_FILE}"
          test "$(yq -r '.api.image.repository' "${VALUES_FILE}")" = \
            "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/household-budget-api"
          test "$(yq -r '.web.image.repository' "${VALUES_FILE}")" = \
            "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/household-budget-web"

          yq -i '.api.image.tag = strenv(IMAGE_TAG)' "${VALUES_FILE}"
          yq -i '.web.image.tag = strenv(IMAGE_TAG)' "${VALUES_FILE}"
          test "$(yq -r '.api.image.tag' "${VALUES_FILE}")" = "${IMAGE_TAG}"
          test "$(yq -r '.web.image.tag' "${VALUES_FILE}")" = "${IMAGE_TAG}"

          echo "API/Web image tag: ${IMAGE_TAG}"

      - name: Commit and push Helm values
        env:
          IMAGE_TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          VALUES_FILE="${CHART_PATH}/values.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"

          if git diff --cached --quiet; then
            echo "이미 최신 태그입니다."
            exit 0
          fi

          git commit -m "ci: deploy household-budget ${IMAGE_TAG} [skip ci]"
          git push origin "HEAD:${GITOPS_BRANCH}"

  notify:
    name: Discord notification
    if: always() && github.event_name != 'pull_request'
    needs: [build-and-push, update-gitops]
    runs-on: ubuntu-latest

    steps:
      - name: Notify image push and GitOps update success
        if: needs.build-and-push.result == 'success' && needs.update-gitops.result == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "✅ 이미지 Push 및 GitOps 업데이트 완료: household-budget"
          description: |
            **이미지 태그:** `build-${{ github.run_number }}`
            **소스 커밋:** `${{ github.sha }}`
            **GitOps 브랜치:** `${{ env.GITOPS_BRANCH }}`
            **Helm Chart:** `${{ env.CHART_PATH }}`
            Argo CD 자동 동기화 대상이 갱신되었습니다.
            Kubernetes 배포 완료 여부는 Argo CD에서 확인해 주세요.
          color: 0x57F287

      - name: Notify failure
        if: needs.build-and-push.result == 'failure' || needs.update-gitops.result == 'failure'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "❌ CI/CD 실패: household-budget"
          description: |
            이미지 빌드 또는 GitOps 업데이트 단계에서 실패했습니다.
            **로그:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0xED4245

      - name: Notify image push without GitOps update
        if: needs.build-and-push.result == 'success' && needs.update-gitops.result == 'skipped'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: warning
          title: "ℹ️ 이미지 Push 완료 · GitOps 업데이트 미수행: household-budget"
          description: |
            **이미지 태그:** `build-${{ github.run_number }}`
            버전 태그 Push 또는 main 이외 ref에서 수동 실행한 경우입니다.
            GitOps 이미지 태그는 변경되지 않았으며, 이번 실행으로 Argo CD 자동 배포는 시작되지 않았습니다.
          color: 0xFEE75C

      - name: Notify cancellation
        if: needs.build-and-push.result == 'cancelled' || needs.update-gitops.result == 'cancelled'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: warning
          title: "⚠️ CI/CD 취소됨: household-budget"
          description: |
            이미지 Push 또는 GitOps 업데이트가 완료되지 않았을 수 있습니다.
            **로그:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0xFEE75C
