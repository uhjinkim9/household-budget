plugins {
    id "com.android.application"
}

android {
    namespace "uk.mercury_lab.household_budget.collector"
    compileSdk 35

    defaultConfig {
        applicationId "uk.mercury_lab.household_budget.collector"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
